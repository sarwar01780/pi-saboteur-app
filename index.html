<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Saboteur Check-in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F6F7F3; --surface:#FFFFFF; --ink:#1F2A2B; --muted:#5B6663; --line:#D8DDD6;
  --sage:#4F6F5E; --sage-soft:#E3EBE5; --plum:#6E3553; --plum-soft:#F1E4EB;
  --b-low:#8FB39C; --b-mild:#D9BE5C; --b-mod:#D4893A; --b-high:#A33A52;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#131918; --surface:#1A2120; --ink:#E6ECE8; --muted:#9AA7A2; --line:#2E3836;
    --sage:#8DB59E; --sage-soft:#1F2B26; --plum:#D293B3; --plum-soft:#2D1F27;
    --b-low:#6E9A7E; --b-mild:#C8AD4E; --b-mod:#D08A45; --b-high:#C9566F;
  }
}
:root[data-theme="dark"]{
  --paper:#131918; --surface:#1A2120; --ink:#E6ECE8; --muted:#9AA7A2; --line:#2E3836;
  --sage:#8DB59E; --sage-soft:#1F2B26; --plum:#D293B3; --plum-soft:#2D1F27;
  --b-low:#6E9A7E; --b-mild:#C8AD4E; --b-mod:#D08A45; --b-high:#C9566F;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased}
main{max-width:720px;margin:0 auto;padding:28px 20px 64px}
h1,h2,h3{font-family:var(--display);line-height:1.12;margin:0 0 .4em;font-weight:700;letter-spacing:-.01em}
h1{font-size:clamp(2.1rem,6vw,3.3rem)}
h2{font-size:1.55rem;margin-top:1.6em}
h3{font-size:1.15rem;margin-top:1.2em}
p{margin:0 0 1em;max-width:66ch}
.muted{color:var(--muted)}
.small{font-size:.9rem}
a{color:var(--sage)}
h1:focus,.qtext:focus{outline:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid var(--sage);outline-offset:2px}
.btn{background:var(--ink);color:var(--paper);border:0;border-radius:999px;padding:.7em 1.4em;font-weight:700}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.link{background:none;border:0;padding:.4em 0;color:var(--muted);text-decoration:underline;text-underline-offset:3px}

/* Home */
.lede{font-size:1.15rem;color:var(--muted);max-width:52ch}
.tests{list-style:none;padding:0;margin:28px 0 0;border-top:1.5px solid var(--ink)}
.tests li{border-bottom:1px solid var(--line)}
.tests button{display:grid;grid-template-columns:2.2rem 1fr auto;gap:4px 14px;width:100%;text-align:left;background:none;border:0;padding:18px 4px;align-items:baseline}
.tests button:hover .t-name{color:var(--sage)}
.t-num{font-family:var(--display);font-size:1.4rem;color:var(--muted)}
.t-name{font-family:var(--display);font-size:1.3rem;font-weight:700}
.t-who{grid-column:2;color:var(--muted);font-size:.95rem}
.t-go{grid-row:1;grid-column:3;color:var(--muted);font-size:.9rem;white-space:nowrap}
.resume{display:inline-block;margin-left:6px;font-size:.8rem;background:var(--sage-soft);color:var(--sage);padding:1px 8px;border-radius:999px}
footer{margin-top:48px;padding-top:16px;border-top:1px solid var(--line);font-size:.85rem;color:var(--muted)}

/* Progress + question */
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px;font-size:.92rem;color:var(--muted)}
.track{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin-bottom:40px}
.track i{display:block;height:100%;background:var(--sage);transition:width .25s ease}
.qnum{font-family:var(--display);color:var(--muted);font-size:1rem;margin-bottom:6px}
.qtext{font-family:var(--display);font-weight:500;font-size:clamp(1.45rem,4.2vw,2rem);line-height:1.25;margin:0 0 32px;max-width:30ch}
.scale{display:grid;grid-template-columns:repeat(5,1fr);border:1.5px solid var(--ink);border-radius:14px;overflow:hidden}
.scale button{background:var(--surface);border:0;border-left:1.5px solid var(--ink);padding:18px 6px 14px;display:flex;flex-direction:column;align-items:center;gap:6px;min-height:96px;justify-content:flex-end}
.scale button:first-child{border-left:0}
.scale .dot{width:var(--d);height:var(--d);border-radius:50%;border:2px solid var(--ink);background:transparent}
.scale .lab{font-size:.85rem;text-align:center;line-height:1.2}
.scale button:hover{background:var(--sage-soft)}
.scale button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.scale button[aria-pressed="true"] .dot{background:var(--paper);border-color:var(--paper)}
.qnav{display:flex;justify-content:space-between;margin-top:18px}
.keys{font-size:.82rem;color:var(--muted);margin-top:22px}
@media (max-width:560px){
  .scale{grid-template-columns:1fr}
  .scale button{border-left:0;border-top:1.5px solid var(--ink);flex-direction:row;justify-content:flex-start;min-height:0;padding:14px 16px;gap:14px}
  .scale button:first-child{border-top:0}
  .scale .dot{flex:none;margin-inline:calc((22px - var(--d)) / 2)}
  .keys{display:none}
}
.opts{display:flex;flex-direction:column;gap:8px;margin-bottom:24px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px}
.opt .box{flex:none;width:20px;height:20px;border:2px solid var(--ink);border-radius:5px;display:grid;place-items:center}
.opt.radio .box{border-radius:50%}
.opt[aria-pressed="true"]{border-color:var(--ink);background:var(--sage-soft)}
.opt[aria-pressed="true"] .box::after{content:"";width:10px;height:10px;background:var(--ink);border-radius:inherit}
.ten{display:grid;grid-template-columns:repeat(11,1fr);gap:4px;margin-bottom:6px}
.ten button{background:var(--surface);border:1.5px solid var(--line);border-radius:8px;padding:12px 0;font-weight:700}
.ten button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.ends{display:flex;justify-content:space-between;font-size:.85rem;color:var(--muted);margin-bottom:24px}
.hint{font-size:.9rem;color:var(--muted);margin:-20px 0 18px}

/* Intro */
.facts{display:grid;grid-template-columns:8rem 1fr;gap:10px 18px;margin:24px 0 28px;padding:18px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.facts dt{font-weight:700}
.facts dd{margin:0}
@media (max-width:560px){.facts{grid-template-columns:1fr}.facts dd{margin-bottom:10px}}

/* Results */
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin:20px 0}
.summary div{background:var(--surface);padding:14px 16px}
.summary b{display:block;font-family:var(--display);font-size:1.7rem;line-height:1.1}
.summary span{font-size:.88rem;color:var(--muted)}
.bars{margin:10px 0 6px}
.bar{display:grid;grid-template-columns:8.5rem 1fr 5.8rem;gap:12px;align-items:center;padding:7px 0}
.bar .nm{font-weight:700;font-size:.95rem}
.bar .tr{position:relative;height:14px;background:
  linear-gradient(90deg,transparent calc(25% - 1px),var(--line) calc(25% - 1px),var(--line) 25%,transparent 25%,transparent calc(50% - 1px),var(--muted) calc(50% - 1px),var(--muted) 50%,transparent 50%,transparent calc(75% - 1px),var(--line) calc(75% - 1px),var(--line) 75%,transparent 75%),var(--sage-soft);border-radius:4px}
.bar .tr i{position:absolute;left:0;top:0;bottom:0;border-radius:4px}
.bar .val{font-size:.9rem;text-align:right;white-space:nowrap}
.judge-row .nm{color:var(--plum)}
.scale-legend{display:grid;grid-template-columns:8.5rem 1fr 5.8rem;gap:12px;font-size:.78rem;color:var(--muted)}
.scale-legend div{display:flex;justify-content:space-between}
@media (max-width:560px){.bar,.scale-legend{grid-template-columns:6.6rem 1fr 4.6rem;gap:8px}.bar .nm{font-size:.85rem}}
.chip{display:inline-block;font-size:.78rem;font-weight:700;padding:2px 9px;border-radius:999px;color:#1F2A2B;vertical-align:middle}
.chip.dk{color:#fff}
.card{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--c,var(--sage));border-radius:12px;padding:16px 18px;margin:12px 0}
.card h3{margin:0 0 .3em}
.card p:last-child{margin-bottom:0}
.alert{background:var(--plum-soft);border:1.5px solid var(--plum);border-radius:12px;padding:16px 18px;margin:18px 0}
.alert h3{margin-top:0;color:var(--plum)}
table{border-collapse:collapse;width:100%;font-size:.92rem}
.tw{overflow-x:auto;margin:10px 0 16px}
th,td{border-bottom:1px solid var(--line);padding:8px 8px;text-align:left;vertical-align:top}
th{font-family:var(--display);font-weight:700}
td.c,th.c{text-align:center}
th.hl,td.hl{background:var(--sage-soft)}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.85rem;word-break:break-all;background:var(--surface);border:1px dashed var(--muted);border-radius:10px;padding:12px;margin:8px 0}
textarea{width:100%;min-height:80px;font:inherit;font-size:.9rem;background:var(--surface);color:var(--ink);border:1.5px solid var(--line);border-radius:10px;padding:10px}
.err{color:var(--b-high);font-weight:700}
.reveal{animation:rise .45s ease both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.reveal{animation:none}.track i{transition:none}}
@media print{.noprint{display:none!important}body{background:#fff;color:#000}.card,.summary div{break-inside:avoid}}
</style>
</head>

   PAIRS      The 10 couple friction pairings and discussion prompts.
   MATRIX     Work-impact matrix (one string of 7 symbols per Saboteur).
   score()    Scoring engine (Section 2 of the assignment document).
   band()     Band cut-offs: 25 / 50 / 75.
   CSS        Colors and fonts are the variables at the top (:root).
   SAVE_URL   Google Sheets saving (top of the script). Paste the Web app URL.
   maybeSave() / hasConsent()   What is sent, and when.

/* ---------- scoring ---------- */
const toScore = avg => Math.round((avg-1)/4*100);
const band = s => s==null?null: s<25?"Low": s<50?"Mild": s<75?"Moderate":"High";
const KIDBAND = {Low:"Rarely seen",Mild:"Sometimes seen",Moderate:"Often seen",High:"Very often seen"};
const bandColor = b => ({Low:"var(--b-low)",Mild:"var(--b-mild)",Moderate:"var(--b-mod)",High:"var(--b-high)"})[b];
const mean = a => a.reduce((x,y)=>x+y,0)/a.length;

function score(key){
  const t=TESTS[key], a=store[key].a;
  const vals=t.items.map(q=>a[q.n]).filter(v=>v!=null);
  const res={answered:vals.length};
  if(vals.length<40){res.valid=false;return res}
  res.valid=true;
  const c={};vals.forEach(v=>c[v]=(c[v]||0)+1);
  res.straight=Math.max(...Object.values(c))>=40;
  res.scores={};
  for(const s of SABS){
    const v=t.items.filter(q=>q.s===s).map(q=>a[q.n]).filter(x=>x!=null);
    res.scores[s]= v.length >= (s==="Judge"?7:3) ? toScore(mean(v)) : null;
  }
  res.sub={};
  for(const k of ["self","others","circ"]){
    const v=t.items.filter(q=>q.sub===k).map(q=>a[q.n]).filter(x=>x!=null);
    res.sub[k]=v.length?toScore(mean(v)):null;
  }
  res.osl=toScore(mean(vals));
  const ranked=ACC.filter(s=>res.scores[s]!=null).sort((x,y)=>res.scores[y]-res.scores[x]);
  res.ranked=ranked;
  res.primary=ranked.filter(s=>res.scores[s]>=50);
  res.shape = ranked.length>=3 && res.scores[ranked[0]]-res.scores[ranked[2]]>=15 ? "Focused":"Spread";
  return res;
}

  if(!STORING) return "Your answers stay in this browser only. Nothing is sent anywhere.";
  if(key==="parent") return "Your answers stay in this browser unless you agree to anonymous research use in question 52 at the end.";
  return `<label style="display:flex;gap:10px;align-items:flex-start;cursor:pointer"><input type="checkbox" id="consent" ${s.consent?"checked":""} style="width:20px;height:20px;margin-top:3px;flex:none"><span>Save my anonymous answers for research. No name, email, or IP address is collected, and you'll see your results either way. This is optional.</span></label>`;
}
function intro(key){
  const t=TESTS[key], s=store[key]||{};
  const started = s.a && (Object.keys(s.a).length||Object.keys(s.b).length);
  const privacy = {
    children:"Results describe patterns you've observed, not diagnoses. Saboteur names are meant for adults; with a child, use friendly words such as 'your worry voice.'",
    work:"You'll be asked for consent before scoring. Your results belong to you. They must never be used for hiring, ranking, or performance reviews.",
    couple:"Answer alone, without discussing with your partner. You choose whether to share a result code for a side-by-side comparison. The tool never rates compatibility.",
    wellbeing:"Part B asks about the past two weeks. Retake the test after 6–8 weeks of practice to see what has changed.",
    parent:"Results are a starting point for learning, never a judgment of whether someone is a good parent."
  }[key];
  return `<div class="reveal">
  <button class="link noprint" data-act="home">All assessments</button>
  <h1>${esc(t.title)}</h1>
  <dl class="facts">
   <dt>Who it's for</dt><dd>${esc(t.who)}</dd>
   <dt>How to answer</dt><dd>${esc(t.instr)}</dd>
   <dt>Length</dt><dd>45 agreement statements, then 7 short questions. ${TIME[key]}.</dd>
   <dt>Privacy</dt><dd>${esc(privacy)}</dd>
   <dt>Saving</dt><dd>${storageRow(key,s)}</dd>
  </dl>
  <div class="row">
   ${started?`<button class="btn" data-act="resume">Continue where you left off</button><button class="btn ghost" data-act="restart">Start over</button>`
            :`<button class="btn" data-act="start">Start the assessment</button>`}
  </div></div>`;
}

function question(key){
  const t=TESTS[key], s=store[key], q=t.items[s.idx], cur=s.a[q.n];
  const pct=Math.round(s.idx/52*100);
  const btns=SCALE.map((l,k)=>`<button data-act="ans" data-v="${k+1}" aria-pressed="${cur===k+1}" style="--d:${[22,17,12,17,22][k]}px"><span class="dot"></span><span class="lab">${l}</span></button>`).join("");
  return `
  <div class="topbar"><button class="link" data-act="intro">${esc(t.short)}</button><span>${q.n} of 52</span></div>
  <div class="track" aria-hidden="true"><i style="width:${pct}%"></i></div>
  <div class="qnum">Statement ${q.n}</div>
  <p class="qtext">${esc(q.text)}</p>
  <div class="scale" role="group" aria-label="Your answer">${btns}</div>
  <div class="qnav"><button class="link" data-act="prev" ${s.idx===0?"disabled":""}>Back</button><button class="link" data-act="skip">Skip this one</button></div>
  <p class="keys">Keyboard: press 1–5 to answer, ← to go back.</p>`;
}

function partB(key){
  const t=TESTS[key], s=store[key], i=s.idx-45, q=t.partB[i], cur=s.b[q.n];
  const pct=Math.round(s.idx/52*100);
  let body="", hint="";
  if(q.t==="Scale"){
    body=`<div class="ten" role="group" aria-label="0 to 10">${Array.from({length:11},(_,k)=>`<button data-act="pick" data-v="${k}" aria-pressed="${cur===k}">${k}</button>`).join("")}</div>
    <div class="ends"><span>0 = ${esc(q.scale[0])}</span><span>10 = ${esc(q.scale[1])}</span></div>`;
  } else {
    const multi=q.t!=="Select one";
    const max = q.t==="Select up to two"?2:99;
    hint = multi? (max===2?"Choose up to two.":"Choose all that apply."):"";
    body=`<div class="opts">${q.o.map((o,k)=>{
      const on = multi ? (Array.isArray(cur)&&cur.includes(k)) : cur===k;
      return `<button class="opt ${multi?"":"radio"}" data-act="${multi?"tog":"pick"}" data-v="${k}" data-max="${max}" aria-pressed="${on}"><span class="box"></span><span>${esc(o)}</span></button>`}).join("")}</div>`;
  }
  const answered = cur!=null && !(Array.isArray(cur)&&cur.length===0);
  const last = i===t.partB.length-1;
  return `
  <div class="topbar"><button class="link" data-act="intro">${esc(t.short)}</button><span>${q.n} of 52</span></div>
  <div class="track" aria-hidden="true"><i style="width:${pct}%"></i></div>
  <div class="qnum">Question ${q.n}</div>
  <p class="qtext">${esc(q.q)}</p>
  ${hint?`<p class="hint">${hint}</p>`:""}
  ${body}
  <div class="row"><button class="btn" data-act="next" ${answered?"":"disabled"}>${last?"See my results":"Next"}</button><button class="link" data-act="prev">Back</button></div>`;
}

function stopView(){
  return `<div class="reveal"><h1>Nothing was saved</h1>
  <p>You chose not to give consent, so no score was calculated and your answers have been removed from this browser.</p>
  <button class="btn" data-act="home">Back to all assessments</button></div>`;
}

/* ---------- results ---------- */
function barsHTML(r,kid){
  const rows=SABS.map(s=>{
    const v=r.scores[s], b=band(v);
    const lab = v==null?"Not scored": kid? KIDBAND[b] : `${v} · ${b}`;
    return `<div class="bar ${s==="Judge"?"judge-row":""}"><span class="nm">${s}</span>
      <span class="tr" role="img" aria-label="${s} ${v==null?"not scored":v+" out of 100, "+b}"><i style="width:${v||0}%;background:${bandColor(b)||"transparent"}"></i></span>
      <span class="val">${lab}</span></div>`}).join("");
  return `<div class="bars">${rows}</div>
  <div class="scale-legend"><span></span><div><span>0</span><span>25</span><span>50</span><span>75</span><span>100</span></div><span></span></div>`;
}
const chip = b => `<span class="chip ${b==="High"?"dk":""}" style="background:${bandColor(b)}">${b}</span>`;

function encodeCode(key,r,mask){
  const s=SABS.map(x=>{const v=r.scores[x]; if(v==null) return -1; if(mask&&v<50) return -2; return v;});
  return "PI-"+key+"-"+btoa(JSON.stringify({v:1,s}));
}
function decodeCode(str,key){
  const m=String(str).trim().match(/^PI-(\w+)-(.+)$/);
  if(!m) throw new Error("That doesn't look like a result code. Codes start with PI-.");
  if(m[1]!==key) throw new Error("That code is from a different assessment. Ask for a code from the same test.");
  const d=JSON.parse(atob(m[2]));
  const o={}; SABS.forEach((x,i)=>o[x]=d.s[i]); return o;
}

function results(key){
  const t=TESTS[key], s=store[key], r=score(key);
  let h=`<div class="reveal"><button class="link noprint" data-act="home">All assessments</button>
  <h1>Your ${esc(t.short.toLowerCase())} results</h1>`;
  if(!r.valid){
    return h+`<div class="alert"><h3>Not enough answers to score</h3><p>You answered ${r.answered} of 45 statements. At least 40 are needed for a reliable profile.</p>
    <button class="btn" data-act="resume0">Go back and answer the skipped ones</button></div></div>`;
  }
  const kid = key==="children";
  const self = kid && bText(key,46)===3;
  const who = kid ? (self?"you":"this child") : "you";

  // Well-being safety first
  let fi=null, quad=null;
  if(key==="wellbeing"){
    fi=Math.round(mean([46,47,48,49,50].map(n=>store[key].b[n]))*10);
    const hard = bText(key,52)===3 || fi<30;
    if(hard) h+=`<div class="alert"><h3>Before the results</h3><p>It sounds like things are hard right now. Please consider reaching out to someone you trust or a qualified professional. In the US, you can call or text 988 (Suicide &amp; Crisis Lifeline) any time, day or night. Outside the US, local health services can point you to support.</p><p>Your results are below whenever you're ready.</p></div>`;
    quad = r.osl<50 ? (fi>=60?"Flourishing":"Languishing") : (fi>=60?"Thriving under strain":"Struggling");
  }

  if(r.straight) h+=`<div class="alert"><h3>Check your answers</h3><p>Almost all of your answers were the same. If you answered quickly, consider retaking the test for a more accurate picture.</p></div>`;

  const top=r.ranked[0];
  h+=`<div class="summary">
    <div><b>${r.osl}</b><span>Overall Saboteur Load · ${band(r.osl)}</span></div>
    <div><b>${r.scores.Judge??"–"}</b><span>Judge · ${band(r.scores.Judge)||"not scored"}</span></div>
    <div><b style="font-size:1.25rem">${top}</b><span>${r.primary.length?"Top Accomplice":"Leading tendency"} · ${r.scores[top]}</span></div>
    ${fi!=null?`<div><b>${fi}</b><span>Flourishing Index</span></div>`:""}
  </div>`;
  h+=`<h2>${kid?"Patterns observed":"Your Saboteur profile"}</h2>${barsHTML(r,kid)}`;
  h+=`<p class="small muted" style="margin-top:14px">Scores run from 0 to 100: (average answer − 1) ÷ 4 × 100. Bands: Low 0–24, Mild 25–49, Moderate 50–74, High 75–100. The Judge is shown separately because it fuels all the others.</p>`;

  // Judge subscales
  const sub=r.sub;
  h+=`<h3>Where the Judge points</h3><div class="tw"><table><tr><th>Judging ${kid&&!self?"themselves":"yourself"}</th><th>Judging others</th><th>Judging circumstances</th></tr>
    <tr>${["self","others","circ"].map(k=>`<td>${sub[k]} ${chip(band(sub[k]))}</td>`).join("")}</tr></table></div>`;

  h+= r.shape==="Focused"
    ? `<p><b>Focused profile.</b> ${top} stands out clearly from the other patterns, so it's the best place to start.</p>`
    : `<p><b>Spread profile.</b> Several patterns score close together. Start with the Judge, which feeds all of them.</p>`;

  const focus = r.primary.length? r.primary : r.ranked.slice(0,1);
  h+= ({children:resChildren,work:resWork,couple:resCouple,wellbeing:resWell,parent:resParent})[key](key,r,focus,{fi,quad,who,self});

  h+=saveBlock(key);
  h+=`<h2 class="noprint">Next steps</h2>
  <p class="noprint">Practice for 6–8 weeks, then retake the test. A change of 10 points or more is a meaningful shift.</p>
  <div class="row noprint"><button class="btn" data-act="print">Print or save as PDF</button><button class="btn ghost" data-act="restart">Retake this test</button><button class="btn ghost" data-act="home">Try another assessment</button></div>
  <footer>Not a diagnostic or clinical tool. Original items inspired by Positive Intelligence (Chamine, 2012).</footer></div>`;
  return h;
}

/* ---------- saving to Google Sheets ---------- */
function getAnonId(){
  try{ let id=localStorage.getItem("pi-anon-id");
    if(!id){ id=(crypto.randomUUID?crypto.randomUUID():String(Math.random()).slice(2)+Date.now()).replace(/-/g,"").slice(0,10); localStorage.setItem("pi-anon-id",id); }
    return id; }catch(e){ return "no-storage"; }
}
function hasConsent(key){ const s=store[key]; return key==="parent" ? s.b[52]===0 : !!s.consent; }
function maybeSave(key,force){
  if(!STORING||!hasConsent(key)) return;
  const s=store[key];
  if(!force && (s.saveState==="sent"||s.saveState==="sending")) return;
  const r=score(key); if(!r.valid) return;
  const payload={anon_id:getAnonId(),test:key,consent_research:true,osl:r.osl,scores:r.scores,judge_sub:r.sub,
                 answers:s.a,part_b:s.b,version:APP_VERSION};
  s.saveState="sending"; save();
  fetch(SAVE_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)})
   .then(()=>{ s.saveState="sent"; save(); refreshSave(key); })
   .catch(()=>{ s.saveState="failed"; save(); refreshSave(key); });
}
function refreshSave(key){ if(view.name==="results"&&view.key===key){ const el=$("#savebox"); if(el) el.innerHTML=saveInner(key); } }
function saveInner(key){
  const s=store[key];
  let msg="";
  if(STORING && hasConsent(key)){
    if(s.saveState==="sent") msg=`<p>Your anonymous answers were saved for research. Your anonymous ID is <b>${esc(getAnonId())}</b>. Keep it if you want to compare a later retake.</p>`;
    else if(s.saveState==="failed") msg=`<p class="err">Your answers could not be saved. Check your internet connection.</p><button class="btn ghost" data-act="retrysave">Try saving again</button>`;
    else msg=`<p>Saving your anonymous answers…</p>`;
  } else if(STORING && key!=="parent") msg=`<p class="small muted">You chose not to save your answers for research, so nothing was sent.</p>`;
  return msg+`<button class="btn ghost" data-act="dl">Download my results (CSV)</button>`;
}
function saveBlock(key){ return `<div id="savebox" class="noprint" style="margin-top:28px">${saveInner(key)}</div>`; }
function downloadCSV(key){
  const t=TESTS[key], s=store[key], r=score(key);
  const q=v=>'"'+String(v).replace(/"/g,'""')+'"';
  const rows=[["Assessment",t.title],["Date",new Date().toISOString().slice(0,10)],[],["Saboteur","Score (0-100)","Band"]];
  SABS.forEach(x=>rows.push([x,r.scores[x]??"",band(r.scores[x])||""]));
  rows.push(["Overall Saboteur Load",r.osl,band(r.osl)],[],["#","Statement","Answer (1-5)"]);
  t.items.forEach(it=>rows.push([it.n,it.text,s.a[it.n]??""]));
  rows.push([],["#","Question","Answer"]);
  t.partB.forEach(p=>{ const v=s.b[p.n]; let a="";
    if(v==null) a=""; else if(p.t==="Scale") a=v; else if(Array.isArray(v)) a=v.map(i=>p.o[i]).join("; "); else a=p.o[v];
    rows.push([p.n,p.q,a]); });
  const blob=new Blob(["\ufeff"+rows.map(r=>r.map(q).join(",")).join("\r\n")],{type:"text/csv;charset=utf-8"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=`saboteur-${key}-results.csv`;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}

function bandAdvice(b,key){
  if(key==="work") return {Low:"Maintain. This pattern isn't limiting your work right now.",Mild:"Awareness. Notice and name it when it shows up ('that's my Controller').",Moderate:"Targeted practice for 6 weeks: one specific behavior change plus a short daily exercise. Then retake the test.",High:"Make a structured plan with a coach or mentor you choose, and change work practices that trigger it."}[b];
  return {Low:"Not currently limiting.",Mild:"Shows up now and then, usually under stress. Noticing it is enough for now.",Moderate:"A regular pattern. Practice the strategy below for 6 weeks.",High:"A strong habit. Make it your main focus, and consider support from a coach, mentor, or counselor."}[b];
}

function resChildren(key,r,focus,ctx){
  const quals = (store[key].b[50]||[]).map(i=>TESTS[key].partB[4].o[i]);
  let h=`<h2>What these patterns may block, and how to help</h2>`;
  focus.forEach(s=>{
    const v=r.scores[s], b=band(v), m=KID[s], linked=m[2].some(q=>quals.includes(q));
    h+=`<div class="card" style="--c:${bandColor(b)}"><h3>${s} <span class="chip ${b==="High"?"dk":""}" style="background:${bandColor(b)}">${KIDBAND[b]}</span></h3>
      <p>${esc(DESC[s])}</p><p><b>May interfere with:</b> ${m[0]}${linked?" — a quality you want to strengthen":""}</p><p><b>Support:</b> ${esc(m[1])}</p></div>`;
  });
  if(focus.some(s=>r.scores[s]>=75)) h+=`<p>One or more patterns are seen very often. If ${ctx.who} also seems distressed, talk with a school counselor or pediatric professional.</p>`;
  const ch=store[key].b[51]||[]; const noneIdx=TESTS[key].partB[5].o.length-1;
  if(ch.some(i=>i!==noneIdx)) h+=`<div class="card" style="--c:var(--plum)"><h3>Context matters</h3><p>You noted recent major changes. High scores shortly after a move, loss, or family change may reflect a temporary stress reaction rather than a lasting pattern. Re-rate in 2–3 months.</p></div>`;
  h+=compareBlock(key,r,"Compare with another observer","Ask a teacher or the other parent to take this test about the same child and share their result code. Patterns seen by both are consistent across settings; patterns seen by one may be setting-specific.");
  return h;
}

function resWork(key,r,focus){
  const picked=(store[key].b[50]||[]).map(i=>Q50MAP[TESTS[key].partB[4].o[i]]);
  const rows=focus.map(s=>`<tr><th>${s}</th>${[...MATRIX[s]].map((c,i)=>`<td class="c ${picked.includes(i)?"hl":""}">${c.trim()}</td>`).join("")}</tr>`).join("");
  let h=`<h2>How this shows up at work</h2><p>● strong effect, ○ some effect. Shaded columns are the areas you said you want to improve.</p>
  <div class="tw"><table><tr><th></th>${MATRIX_COLS.map((c,i)=>`<th class="c ${picked.includes(i)?"hl":""}">${c}</th>`).join("")}</tr>${rows}</table></div>`;
  focus.forEach(s=>{const v=r.scores[s],b=band(v),w=WORK[s];
    h+=`<div class="card" style="--c:${bandColor(b)}"><h3>${s} ${chip(b)}</h3><p>${esc(DESC[s])}</p><p><b>${bandAdvice(b,key)}</b></p><p><b>Try this:</b> ${esc(w[0])}</p><p class="small muted">Role fit: can be an asset for ${w[1].toLowerCase()}; watch for ${w[2].toLowerCase()}. This note is for your own career choices only.</p></div>`});
  const share=bText(key,52);
  const msg=["You chose to keep these results private. Only you can see them.","You chose to share with a coach or mentor. Use Print or save as PDF to share this page.","You chose to share with your manager for a development conversation. Share only what you're comfortable with.","You chose to be included in a team summary. Teams only see averages, and only when 5 or more people take part."][share];
  if(msg) h+=`<p class="small muted">${msg}</p>`;
  return h;
}

function resCouple(key,r,focus){
  let h=`<h2>Your likely triggers at home</h2>`;
  const tens=(store[key].b[49]||[]).map(i=>TESTS[key].partB[3].o[i]).filter(x=>x!=="None at present");
  if(tens.length) h+=`<p>You named tension around: ${tens.map(esc).join(", ").toLowerCase()}. Look for where these patterns show up in those areas.</p>`;
  focus.forEach(s=>{const b=band(r.scores[s]);
    h+=`<div class="card" style="--c:${bandColor(b)}"><h3>${s} ${chip(b)}</h3><p>${esc(DESC[s])}</p><p><b>Try this:</b> ${esc(COUPLE[s])}</p></div>`});
  const consent=bText(key,52);
  if(consent===2){
    h+=`<h2>Couple comparison</h2><p>You chose to keep your results private, so no result code was created. You can still enter your partner's code below if they shared one, but they won't see yours.</p>`;
    h+=compareBlock(key,r,null,null,true);
  } else {
    h+=compareBlock(key,r,"Compare with your partner", consent===1?"Your code shares only your top patterns (scores of 50 or more).":"Your code shares your full scores. Give it to your partner and paste theirs below.", false, consent===1);
  }
  h+=`<p class="small muted">The comparison is a discussion guide, never a compatibility score. If you feel afraid of or controlled by your partner, this isn't the right tool. In the US, the National Domestic Violence Hotline is available at 1-800-799-7233 or thehotline.org.</p>`;
  return h;
}

function resWell(key,r,focus,ctx){
  const labels=["Joy","Meaning","Resilience","Connection","Calm presence"];
  const qtext={"Flourishing":"Saboteurs have little pull and everyday well-being is good. Keep doing what works.","Thriving under strain":"Life feels good, but it may be costing you. Watch for burnout and practice rest without guilt.","Languishing":"Your low well-being isn't explained by Saboteurs. Look at circumstances, health, sleep, and connection. Freedom from Saboteurs alone doesn't guarantee joy.","Struggling":"Saboteurs are likely draining your well-being. Make mental-fitness practice a priority, and reach out for support if you need it."}[ctx.quad];
  let h=`<h2>Well-being</h2><div class="card" style="--c:var(--sage)"><h3>${ctx.quad}</h3><p>Saboteur Load ${r.osl} (high at 50+) and Flourishing Index ${ctx.fi} (high at 60+).</p><p>${qtext}</p></div>
  <div class="bars">${[46,47,48,49,50].map((n,i)=>{const v=store[key].b[n]*10;return `<div class="bar"><span class="nm">${labels[i]}</span><span class="tr"><i style="width:${v}%;background:var(--sage)"></i></span><span class="val">${v/10} / 10</span></div>`}).join("")}</div>`;
  const acts=(store[key].b[51]||[]).map(i=>TESTS[key].partB[5].o[i]);
  if(acts.length) h+=`<p style="margin-top:14px">Build on what already restores you: ${acts.map(esc).join(", ").toLowerCase()}.</p>`;
  h+=`<h2>Patterns to practice with</h2>`;
  focus.forEach(s=>{const b=band(r.scores[s]);
    h+=`<div class="card" style="--c:${bandColor(b)}"><h3>${s} ${chip(b)}</h3><p>${esc(DESC[s])}</p><p><b>${bandAdvice(b)}</b></p><p><b>Try this:</b> ${esc(WELL[s])}</p></div>`});
  return h;
}

function resParent(key,r,focus){
  let h=`<h2>Your parenting-response profile</h2><p>These links are hypotheses for study, not established facts.</p>
  <div class="tw"><table><tr><th>Saboteur</th><th>Parenting pattern</th><th>May affect</th></tr>
  ${focus.map(s=>`<tr><td><b>${s}</b> ${chip(band(r.scores[s]))}</td><td>${esc(PARENT[s][0])}</td><td>${esc(PARENT[s][1])}</td></tr>`).join("")}</table></div>`;
  focus.forEach(s=>{const b=band(r.scores[s]);
    h+=`<div class="card" style="--c:${bandColor(b)}"><h3>${s}</h3><p><b>${bandAdvice(b)}</b></p><p><b>Try this:</b> ${esc(PARENT[s][2])}</p></div>`});
  const skills=(store[key].b[51]||[]).map(i=>TESTS[key].partB[5].o[i]);
  if(skills.length){
    h+=`<h3>Skills you asked for</h3>`;

      h+=`<p><b>${esc(k)}:</b> ${rel.length?`linked to your ${rel.join(" and ")} pattern${rel.length>1?"s":""}. ${esc(PARENT[rel[0]][2])}`:"none of the related patterns are strong for you. Keep building on what you already do."}</p>`});
  }
  h+=`<p class="small muted">${bText(key,52)===0?(STORING?"You agreed to anonymous research use.":"You agreed to anonymous research use, but saving is not switched on in this version, so nothing was sent."):"You declined research use. Your answers stay private."} Scores must never be used for child-protection, custody, or benefit decisions.</p>`;
  return h;
}

function compareBlock(key,r,title,text,noCode,mask){
  const code = noCode? "" : encodeCode(key,r,mask);
  return `<div class="noprint">${title?`<h2>${title}</h2>`:""}${text?`<p>${text}</p>`:""}
   ${code?`<p><b>Your result code</b></p><div class="code" id="mycode">${code}</div><button class="btn ghost" data-act="copy">Copy my code</button>`:""}
   <p style="margin-top:18px"><label for="their"><b>Paste the other code</b></label></p>
   <textarea id="their" placeholder="PI-${key}-…"></textarea>
   <div class="row" style="margin-top:8px"><button class="btn" data-act="compare">Compare</button></div>
   <div id="cmp"></div></div>`;
}

function runCompare(key){
  const r=score(key); const out=$("#cmp");
  let other; try{ other=decodeCode($("#their").value,key);}catch(e){ out.innerHTML=`<p class="err">${esc(e.message)}</p>`; return; }
  const me=r.scores;
  if(key==="children"){
    const rows=SABS.filter(s=>(me[s]>=50)||(other[s]>=50)).map(s=>{
      const a=me[s],b=other[s];
      const lvl= a>=50&&b>=50?"Consistent across settings":"Setting-specific";
      const tip= a>=50&&b>=50?"Coordinate the same strategy at home and school.":"Look at what's different about the setting where it shows up: demands, peers, routines.";
      const f=x=>(x==null||x<0)?"–":x; return `<tr><td><b>${s}</b></td><td>${f(a)}</td><td>${f(b)}</td><td>${lvl}</td><td>${tip}</td></tr>`}).join("");
    out.innerHTML = rows? `<div class="tw"><table><tr><th>Pattern</th><th>You</th><th>Other</th><th>Result</th><th>Next step</th></tr>${rows}</table></div>`:`<p>Neither observer sees any pattern often (all below 50). Nothing needs focused attention right now.</p>`;
    return;
  }
  const lvl=(a,b)=>{ if(a>=50&&b>=50) return "Active"; if(a===-2||b===-2){ if(a>=50||b>=50) return "Not shared"; return "Low"; } if((a>=50&&b>=25)||(b>=50&&a>=25)) return "Watch"; return "Low"; };
  const rank={Active:0,Watch:1,"Not shared":2,Low:3};
  const found=[];
  PAIRS.forEach(([x,y,cyc,prompt])=>{
    const dirs = x===y? [[me[x],other[y],"Both of you"]] : [[me[x],other[y],`You: ${x}, partner: ${y}`],[other[x],me[y],`Partner: ${x}, you: ${y}`]];
    dirs.forEach(([a,b,who])=>{const L=lvl(a,b); if(L!=="Low") found.push({x,y,cyc,prompt,who,L});});
  });
  found.sort((p,q)=>rank[p.L]-rank[q.L]);
  const shared=SABS.filter(s=>me[s]>=50&&other[s]>=50);
  const bal=SABS.filter(s=>(me[s]>=50&&other[s]>=0&&other[s]<25)||(other[s]>=50&&me[s]>=0&&me[s]<25));
  const levelColor={Active:"var(--b-high)",Watch:"var(--b-mod)","Not shared":"var(--muted)"};
  let h="";
  h+= shared.length? `<p><b>Shared patterns:</b> ${shared.join(", ")}. These can reinforce each other.</p>`:"";
  h+= bal.length? `<p><b>Balancing patterns:</b> ${bal.join(", ")}. The partner with the low score may help calm this pattern, if you both agree to it.</p>`:"";
  h+= found.length? found.map(f=>`<div class="card" style="--c:${levelColor[f.L]}"><h3>${f.x} × ${f.y} <span class="chip ${f.L==="Active"?"dk":""}" style="background:${levelColor[f.L]}">${f.L}</span></h3><p class="small muted">${f.who}</p><p>${esc(f.cyc)}</p><p><b>Talk about:</b> ${esc(f.prompt)}</p></div>`).join("")
    : `<p>No friction pairings are active or on watch. Keep checking in, especially during stressful periods.</p>`;
  h+=`<p class="small muted">Active: both 50+. Watch: one 50+, the other 25–49, so it may appear under stress. Not shared: your partner shared only top patterns.</p>`;
  out.innerHTML=h;
}

/* ---------- render + events ---------- */
function render(){
  const v=view, app=$("#app");
  if(v.name==="home") app.innerHTML=home();
  else if(v.name==="intro") app.innerHTML=intro(v.key);
  else if(v.name==="q"){ const s=store[v.key]; app.innerHTML = s.idx<45? question(v.key) : partB(v.key); }
  else if(v.name==="stop") app.innerHTML=stopView();
  else if(v.name==="results") app.innerHTML=results(v.key);
}

document.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]"); if(!b||b.disabled) return;
  const act=b.dataset.act, key=view.key;
  if(act==="home") return go({name:"home"});
  if(act==="open"){ const s=store[b.dataset.k]; return go({name: s&&s.done?"results":"intro", key:b.dataset.k}); }
  if(act==="intro") return go({name:"intro",key});
  if(act==="start"){ ensure(key); save(); return go({name:"q",key}); }
  if(act==="resume"){ ensure(key); return go({name:"q",key}); }
  if(act==="resume0"){ const s=store[key]; s.done=false; const miss=TESTS[key].items.findIndex(q=>s.a[q.n]==null); s.idx=miss<0?0:miss; save(); return go({name:"q",key}); }
  if(act==="restart"){ store[key]={a:{},b:{},idx:0,done:false,consent:(store[key]||{}).consent}; save(); return go({name:"q",key}); }
  const s=store[key];
  if(act==="ans"){ const q=TESTS[key].items[s.idx]; s.a[q.n]=+b.dataset.v; s.idx++; save(); return go({name:"q",key}); }
  if(act==="skip"){ const q=TESTS[key].items[s.idx]; delete s.a[q.n]; s.idx++; save(); return go({name:"q",key}); }
  if(act==="prev"){ if(s.idx>0) s.idx--; save(); return go({name:"q",key}); }
  if(act==="pick"){ const q=TESTS[key].partB[s.idx-45]; s.b[q.n]=+b.dataset.v; save(); render(); return; }
  if(act==="tog"){ const q=TESTS[key].partB[s.idx-45]; const v=+b.dataset.v, max=+b.dataset.max;
    let arr=Array.isArray(s.b[q.n])?s.b[q.n]:[];
    const noneLike = /^(No major changes|None at present|No major concerns|Not sure)$/.test(q.o[v]);
    if(arr.includes(v)) arr=arr.filter(x=>x!==v);
    else { if(noneLike) arr=[v]; else { arr=arr.filter(x=>!/^(No major changes|None at present|No major concerns|Not sure)$/.test(q.o[x])); if(arr.length<max) arr.push(v); else if(max===2){arr.shift();arr.push(v);} } }
    s.b[q.n]=arr; save(); render(); return; }
  if(act==="next"){
    const q=TESTS[key].partB[s.idx-45];
    if(key==="work" && q.n===46 && s.b[46]===1){ delete store[key]; save(); return go({name:"stop"}); }
    if(s.idx>=51){ s.done=true; save(); go({name:"results",key}); maybeSave(key); return; }
    s.idx++; save(); return go({name:"q",key}); }
  if(act==="print") return window.print();
  if(act==="dl") return downloadCSV(key);
  if(act==="retrysave") return maybeSave(key,true);
  if(act==="copy"){ const t=$("#mycode").textContent; const done=()=>{b.textContent="Copied";setTimeout(()=>b.textContent="Copy my code",1500)};
    if(navigator.clipboard) navigator.clipboard.writeText(t).then(done,()=>{selectCode();}); else selectCode(); return; }
  if(act==="compare") return runCompare(key);
});
function selectCode(){ const r=document.createRange(); r.selectNodeContents($("#mycode")); const sel=getSelection(); sel.removeAllRanges(); sel.addRange(r); }

document.addEventListener("change",e=>{ if(e.target.id==="consent"&&view.key){ ensure(view.key).consent=e.target.checked; save(); } });

document.addEventListener("keydown",e=>{
  if(view.name!=="q") return; const s=store[view.key];
  if(e.target.tagName==="TEXTAREA") return;
  if(s.idx<45 && /^[1-5]$/.test(e.key)){ const btn=document.querySelector(`.scale [data-v="${e.key}"]`); if(btn) btn.click(); }
  if(e.key==="ArrowLeft" && s.idx>0){ s.idx--; save(); go({name:"q",key:view.key}); }
});
render();
</script>
